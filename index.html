<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dual Launcher P2P</title>
    <!-- Подключаем Tailwind CSS для красивого и адаптивного дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем PeerJS для прямого соединения между телефонами -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overscroll-behavior: none;
        }
        .app-icon {
            transition: transform 0.1s;
        }
        .app-icon:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="bg-neutral-950 text-white h-[100dvh] w-screen overflow-hidden flex flex-col justify-between font-sans">

    <!-- ЭКРАН ПОДКЛЮЧЕНИЯ (Связка 2 телефонов) -->
    <div id="connection-screen" class="fixed inset-0 bg-neutral-950 z-50 flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-xs bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-4">
            <h1 class="text-xl font-bold tracking-wide">Dual Launcher</h1>
            <p class="text-xs text-neutral-400 text-center">Свяжите два телефона в единый экран (как Fold)</p>

            <div id="status-box" class="w-full bg-neutral-950 p-3 rounded-xl border border-neutral-800 text-center text-xs text-amber-400 font-mono">
                Инициализация связи...
            </div>

            <!-- Режим создания комнаты -->
            <div id="host-section" class="w-full flex flex-col gap-2">
                <button onclick="createRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium py-3 rounded-xl transition text-sm">
                    Создать комнату (Телефон 1)
                </button>
                <div id="room-code-display" class="hidden text-center text-lg font-mono tracking-widest bg-neutral-950 py-2 rounded-lg border border-neutral-800 text-emerald-400">
                    ----
                </div>
            </div>

            <div class="w-full flex items-center gap-2 my-1">
                <div class="h-[1px] bg-neutral-800 flex-1"></div>
                <span class="text-[10px] text-neutral-500 uppercase">или</span>
                <div class="h-[1px] bg-neutral-800 flex-1"></div>
            </div>

            <!-- Режим подключения к комнате -->
            <div id="join-section" class="w-full flex flex-col gap-2">
                <input type="text" id="join-code-input" placeholder="Введите код комнаты" maxlength="4" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-center text-sm font-mono tracking-widest text-white focus:outline-none focus:border-indigo-500 uppercase">
                <button onclick="joinRoom()" class="w-full bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-900 text-white font-medium py-3 rounded-xl transition text-sm">
                    Подключиться (Телефон 2)
                </button>
            </div>
        </div>
    </div>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ ЛАУНЧЕРА -->
    <header class="w-full px-4 py-3 flex items-center justify-between border-b border-neutral-900 bg-neutral-950/80 backdrop-blur shrink-0">
        <div class="flex items-center gap-2">
            <span id="role-badge" class="px-2 py-0.5 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded text-[10px] font-medium uppercase">Устройство</span>
            <span id="connection-status-dot" class="w-2 h-2 rounded-full bg-red-500"></span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleFullscreen()" class="px-3 py-1 bg-neutral-900 border border-neutral-800 rounded-lg text-xs text-neutral-300 hover:bg-neutral-800 active:scale-95 transition">Фуллскрин</button>
            <button onclick="location.reload()" class="px-3 py-1 bg-neutral-900 border border-neutral-800 rounded-lg text-xs text-neutral-300 hover:bg-neutral-800 active:scale-95 transition">Сброс</button>
        </div>
    </header>

    <!-- РАБОЧИЙ СТОЛ (СЕТКА ПРИЛОЖЕНИЙ) -->
    <main class="flex-1 w-full max-w-md mx-auto p-4 flex flex-col justify-between overflow-y-auto">
        <div>
            <!-- Индикатор страниц (точки) -->
            <div class="flex justify-center gap-1.5 mb-6">
                <div id="dot-0" class="w-6 h-1.5 rounded-full bg-indigo-500 transition-all duration-300"></div>
                <div id="dot-1" class="w-1.5 h-1.5 rounded-full bg-neutral-700 transition-all duration-300"></div>
            </div>

            <!-- Страницы рабочих столов -->
            <div id="desktop-pages" class="grid grid-cols-4 gap-4">
                <!-- Страница 1 (Заполняется через JS) -->
            </div>
        </div>

        <!-- Док-бар внизу -->
        <div class="w-full bg-neutral-900/60 border border-neutral-800/80 backdrop-blur-md rounded-2xl p-3 flex justify-around items-center mt-4 shrink-0">
            <div onclick="openApp('Телефон')" class="flex flex-col items-center gap-1 cursor-pointer app-icon">
                <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-xl shadow-lg">📞</div>
                <span class="text-[10px] text-neutral-400">Телефон</span>
            </div>
            <div onclick="openApp('Сообщения')" class="flex flex-col items-center gap-1 cursor-pointer app-icon">
                <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-xl shadow-lg">💬</div>
                <span class="text-[10px] text-neutral-400">Чаты</span>
            </div>
            <div onclick="openApp('Браузер')" class="flex flex-col items-center gap-1 cursor-pointer app-icon">
                <div class="w-12 h-12 bg-amber-600 rounded-2xl flex items-center justify-center text-xl shadow-lg">🌐</div>
                <span class="text-[12px] text-neutral-400">Браузер</span>
            </div>
            <div onclick="openApp('Настройки')" class="flex flex-col items-center gap-1 cursor-pointer app-icon">
                <div class="w-12 h-12 bg-purple-600 rounded-2xl flex items-center justify-center text-xl shadow-lg">⚙️️</div>
                <span class="text-[10px] text-neutral-400">Настройки</span>
            </div>
        </div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО ОТКРЫТОГО ПРИЛОЖЕНИЯ -->
    <div id="app-modal" class="fixed inset-0 bg-neutral-950/90 backdrop-blur-md z-40 hidden flex flex-col p-4 animate-in fade-in duration-200">
        <div class="flex items-center justify-between pb-3 border-b border-neutral-900">
            <h2 id="modal-title-text" class="text-sm font-bold text-white">Приложение</h2>
            <button onclick="closeApp()" class="px-3 py-1 bg-neutral-900 rounded-lg text-xs border border-neutral-800">Закрыть</button>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center text-center p-6">
            <div id="modal-icon" class="text-5xl mb-4">📱</div>
            <p id="modal-desc" class="text-xs text-neutral-400">Интерфейс приложения синкован на оба экрана Fold.</p>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let myRole = '';
        let currentPage = 0;

        // Данные рабочего стола
        const apps = [
            { name: "Камера", icon: "📷", color: "bg-rose-600" },
            { name: "Галерея", icon: "🖼️", color: "bg-orange-600" },
            { name: "YouTube", icon: "▶️", color: "bg-red-600" },
            { name: "Музыка", icon: "🎵", color: "bg-violet-600" },
            { name: "Карты", icon: "🗺️", color: "bg-green-600" },
            { name: "Заметки", icon: "📝", color: "bg-yellow-600" },
            { name: "Калькулятор", icon: "🔢", color: "bg-cyan-600" },
            { name: "Игра", icon: "🎮", color: "bg-indigo-600" },
        ];

        function renderDesktop() {
            const container = document.getElementById('desktop-pages');
            container.innerHTML = '';
            apps.forEach((app, index) => {
                const el = document.createElement('div');
                el.className = "flex flex-col items-center gap-1.5 cursor-pointer app-icon";
                el.onclick = () => {
                    openApp(app.name, app.icon);
                    sendData({ type: 'OPEN_APP', name: app.name, icon: app.icon });
                };
                el.innerHTML = `
                    <div class="w-16 h-16 ${app.color} rounded-2xl flex items-center justify-center text-2xl shadow-lg">${app.icon}</div>
                    <span class="text-[11px] text-neutral-300 font-medium">${app.name}</span>
                `;
                container.appendChild(el);
            });

            // Обновляем индикаторы точек
            document.getElementById('dot-0').className = currentPage === 0 ? "w-6 h-1.5 rounded-full bg-indigo-500 transition-all duration-300" : "w-1.5 h-1.5 rounded-full bg-neutral-700 transition-all duration-300";
            document.getElementById('dot-1').className = currentPage === 1 ? "w-6 h-1.5 rounded-full bg-indigo-500 transition-all duration-300" : "w-1.5 h-1.5 rounded-full bg-neutral-700 transition-all duration-300";
        }

        // Инициализация PeerJS с четырехзначным кодом
        function initPeer(customId = null) {
            const statusBox = document.getElementById('status-box');
            peer = customId ? new Peer(customId) : new Peer();

            peer.on('open', (id) => {
                if (customId) {
                    myRole = 'Телефон 1 (Хост)';
                    document.getElementById('role-badge').innerText = 'Хост';
                    document.getElementById('room-code-display').innerText = id;
                    document.getElementById('room-code-display').classList.remove('hidden');
                    statusBox.innerText = 'Комната создана! Введите этот код на 2-м телефоне.';
                    statusBox.className = "w-full bg-neutral-950 p-3 rounded-xl border border-neutral-800 text-center text-xs text-emerald-400 font-mono";
                } else {
                    myRole = 'Телефон 2 (Клиент)';
                    document.getElementById('role-badge').innerText = 'Клиент';
                    statusBox.innerText = 'Готов к подключению. Введите код комнаты.';
                    statusBox.className = "w-full bg-neutral-950 p-3 rounded-xl border border-neutral-800 text-center text-xs text-indigo-400 font-mono";
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });

            peer.on('error', (err) => {
                statusBox.innerText = 'Ошибка связи: проверьте код или интернет.';
                statusBox.className = "w-full bg-neutral-950 p-3 rounded-xl border border-neutral-800 text-center text-xs text-red-400 font-mono";
            });
        }

        function createRoom() {
            // Генерируем случайный 4-значный код комнаты
            const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
            initPeer(randomCode);
        }

        function joinRoom() {
            const code = document.getElementById('join-code-input').value.trim().toUpperCase();
            if (!code || code.length < 4) {
                alert('Введите корректный 4-значный код комнаты!');
                return;
            }
            const statusBox = document.getElementById('status-box');
            statusBox.innerText = 'Подключение к комнате ' + code + '...';

            conn = peer.connect(code);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('connection-screen').style.display = 'none';
                document.getElementById('connection-status-dot').className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]";
                console.log('Успешно подключено к другому телефону!');
            });

            conn.on('data', (data) => {
                handleIncomingData(data);
            });

            conn.on('close', () => {
                alert('Соединение с другим телефоном разорвано.');
                location.reload();
            });
        }

        function sendData(data) {
            if (conn && conn.open) {
                conn.send(data);
            }
        }

        function handleIncomingData(data) {
            if (data.type === 'OPEN_APP') {
                openAppLocally(data.name, data.icon);
            } else if (data.type === 'CLOSE_APP') {
                closeAppLocally();
            }
        }

        function openApp(name, icon = '📱') {
            openAppLocally(name, icon);
        }

        function openAppLocally(name, icon) {
            document.getElementById('modal-title-text').innerText = name;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('app-modal').classList.remove('hidden');
        }

        function closeApp() {
            closeAppLocally();
            sendData({ type: 'CLOSE_APP' });
        }

        function closeAppLocally() {
            document.getElementById('app-modal').classList.add('hidden');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Автоматически запускаем инициализацию Peer при загрузке
        window.onload = () => {
            initPeer();
            renderDesktop();
        };
    </script>
</body>
</html>
